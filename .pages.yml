media:
  input: src/media
  output: /media
  rename: random
  extensions: [jpg, jpeg, png, webp]

content:
  - name: concerts
    label: Konzerte
    type: collection
    path: src/concerts
    format: yaml-frontmatter
    filename: "{eventDate}-{primary}.md"
    exclude: [concerts.11tydata.js]
    subfolders: false
    view:
      primary: title
      fields: [title, eventDate, venue]
      sort: eventDate
      order: desc
    fields:
      - name: title
        label: Konzerttitel
        type: string
        required: true
      - name: eventDate
        label: Datum
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: eventTime
        label: Beginn
        description: "Uhrzeit in Bern, zum Beispiel 20:00"
        type: string
        pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
      - name: doorsTime
        label: Türöffnung
        description: "Uhrzeit in Bern, zum Beispiel 18:30"
        type: string
        pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
      - name: venue
        label: Veranstaltungsort
        type: string
        required: true
      - name: address
        label: Adresse
        description: "Strasse, Hausnummer, PLZ und Ort. Für Schweizer Adressen wird die Karte automatisch gefunden."
        type: string
      - name: latitude
        label: Breitengrad für die Karte
        description: "Optional. Beide Koordinaten eingeben, um die Kartenposition festzulegen."
        required: false
        type: string
        pattern: '^(-?[0-9]+(\.[0-9]+)?)?$'
      - name: longitude
        label: Längengrad für die Karte
        description: "Optional. Beide Koordinaten eingeben, um die Kartenposition festzulegen."
        required: false
        type: string
        pattern: '^(-?[0-9]+(\.[0-9]+)?)?$'
      - name: image
        label: Konzertbild
        type: image
      - name: imageAlt
        label: Alternativtext zum Bild
        type: string
      - name: ticketUrl
        label: Ticketlink
        description: "Optional. Falls vorhanden, vollständige URL mit https:// eingeben."
        type: string
        required: false
        pattern: '^(https?://.+)?$'
      - name: body
        label: Beschreibung
        type: rich-text
        required: true
        options:
          format: markdown
          media: false
