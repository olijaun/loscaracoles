media:
  input: src/media
  output: /media
  rename: random
  extensions: [jpg, jpeg, png, webp]

content:
  - name: events
    label: Veranstaltungen
    type: collection
    path: src/events
    format: yaml-frontmatter
    filename: "{eventDate}-{primary}.md"
    exclude: [events.11tydata.js]
    subfolders: false
    view:
      primary: title
      fields: [title, eventDate, venue, organizer]
      sort: eventDate
      order: desc
    fields:
      - name: title
        label: Veranstaltungstitel
        type: string
        required: true
      - name: summary
        label: Kurzbeschreibung
        description: "Ein bis zwei kurze Sätze für die Veranstaltungsliste."
        type: text
        required: true
        options:
          maxlength: 220
      - name: organizer
        label: Veranstalter
        type: select
        required: true
        options:
          values: [Los Caracoles, Fremdveranstaltung]
      - name: eventDate
        label: Datum
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: eventTime
        label: Beginn
        description: "Uhrzeit in Bern, zum Beispiel 20:00"
        type: string
        pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
      - name: endDate
        label: Enddatum
        description: "Optional. Bei Veranstaltungen über mehrere Tage."
        type: date
        default: ""
        options:
          format: yyyy-MM-dd
      - name: endTime
        label: Ende
        description: "Optional. Uhrzeit in Bern, zum Beispiel 20:30."
        type: string
        pattern: '^(([01][0-9]|2[0-3]):[0-5][0-9])?
        label: Türöffnung
        description: "Uhrzeit in Bern, zum Beispiel 18:30"
        type: string
        pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
      - name: venue
        label: Veranstaltungsort
        type: string
        required: true
      - name: address
        label: Adresse
        description: "Strasse, Hausnummer, PLZ und Ort. Für Schweizer Adressen wird die Karte automatisch gefunden."
        type: string
      - name: latitude
        label: Breitengrad für die Karte
        description: "Optional. Beide Koordinaten eingeben, um die Kartenposition festzulegen."
        required: false
        type: string
        pattern: '^(-?[0-9]+(\.[0-9]+)?)?$'
      - name: longitude
        label: Längengrad für die Karte
        description: "Optional. Beide Koordinaten eingeben, um die Kartenposition festzulegen."
        required: false
        type: string
        pattern: '^(-?[0-9]+(\.[0-9]+)?)?$'
      - name: image
        label: Veranstaltungsbild
        type: image
        required: false
      - name: imageAlt
        label: Alternativtext zum Bild
        type: string
      - name: ticketUrl
        label: Ticketlink
        description: "Optional. Falls vorhanden, vollständige URL mit https:// eingeben."
        type: string
        required: false
        pattern: '^(https?://.+)?$'
      - name: body
        label: Beschreibung
        type: rich-text
        required: true
        options:
          format: markdown
          media: false

actions:
  - name: publish-site
    label: Website neu veröffentlichen
    workflow: pages.yml
    ref: main

